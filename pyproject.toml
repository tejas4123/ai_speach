[project]
name = "realtime-voice-agent"
version = "0.1.0"
description = "Low-latency AI phone agent: Twilio + Deepgram + LLM function calling + streaming TTS, with barge-in"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
